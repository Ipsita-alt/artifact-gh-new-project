name: Deploy Website
on:
   push:
    branches:
      - main
jobs:
  test:
     runs-on: ubuntu-latest
     steps:
       - name: Get Code
         uses: actions/checkout@v6
       - name: Install dependencies
         run: npm ci
       - name: Lint code
         run: npm run lint
       - name: Test code
         run: npm run test
  build:
     needs: test
     runs-on: ubuntu-latest
     steps:
       - name: Get Code
         uses: actions/checkout@v6
       - name: Install dependencies
         run: npm ci
       - name: Build Website
         run: npm run build
       - name: Upload Artifacts
         uses: actions/upload-artifact@v4
         with:
           name: my-artifact
           path: |
             dist
             package.json
  deploy:
     needs: build
     runs-on: ubuntu-latest
     steps:
       - name: Get build artifacts
         uses: actions/download-artifact@v4
         with:
            name: my-artifact
       - name: Output artifact contents
         run: ls
       - name: Deploy
         run: echo "Deploying to GitHub Pages..."